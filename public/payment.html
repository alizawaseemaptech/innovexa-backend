<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Your Payment — Innovexa Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070c; --panel:#0d121c; --line:rgba(148,171,209,0.14);
    --steel:#cdd4dd; --dim:#7c8798; --blue:#2f7dff; --bright:#57a8ff; --cyan:#4fd6e0;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--steel); font-family:'Inter',sans-serif; min-height:100vh; }
  .mono{ font-family:'IBM Plex Mono',monospace; letter-spacing:0.06em; text-transform:uppercase; }
  header{ padding:22px 6%; border-bottom:1px solid var(--line); }
  header h1{ font-family:'Space Grotesk',sans-serif; font-size:1.1rem; color:#fff; }
  header h1 span{ color:var(--bright); }
  main{ max-width:560px; margin:0 auto; padding:50px 20px 80px; }

  .state{ text-align:center; padding:80px 20px; color:var(--dim); }
  .state.error{ color:#ff8a8a; }

  .summary{
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:28px;
    margin-bottom:32px;
  }
  .summary h2{ color:#fff; font-size:1.3rem; margin-bottom:18px; }
  .summary-row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:0.9rem; }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row span:first-child{ color:var(--dim); }
  .amount-due{ font-family:'Space Grotesk',sans-serif; font-size:1.8rem; color:var(--cyan); font-weight:700; }

  .method-tabs{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:24px; }
  .method-tab{
    background:var(--panel); border:1px solid var(--line); color:var(--steel); padding:14px 8px;
    border-radius:6px; font-size:0.75rem; cursor:pointer; text-align:center; transition:all .2s;
  }
  .method-tab.active{ border-color:var(--bright); color:#fff; background:rgba(47,125,255,0.1); }

  .method-panel{ display:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:28px; }
  .method-panel.active{ display:block; }
  .method-panel h3{ color:#fff; font-size:1.05rem; margin-bottom:14px; }
  .account-box{
    background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:16px 18px; margin-bottom:18px;
  }
  .account-box div{ display:flex; justify-content:space-between; padding:6px 0; font-size:0.88rem; }
  .account-box .label{ color:var(--dim); }
  .account-box .value{ color:#fff; font-family:'IBM Plex Mono',monospace; }
  .note{ font-size:0.82rem; color:var(--dim); line-height:1.5; margin-bottom:20px; }

  label{ display:block; font-size:0.68rem; color:var(--dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px; margin-top:16px; }
  input{
    width:100%; background:var(--bg); border:1px solid var(--line); color:#fff; padding:13px 14px;
    border-radius:4px; font-size:0.9rem; outline:none;
  }
  input:focus{ border-color:var(--bright); }
  button.submit-btn{
    width:100%; margin-top:22px; padding:15px; background:linear-gradient(100deg,var(--blue),var(--cyan));
    color:#04060a; font-weight:700; border:none; border-radius:6px; cursor:pointer; font-size:0.95rem;
  }
  button.submit-btn:disabled{ opacity:0.6; cursor:default; }

  #paypal-button-container{ margin-top:10px; }

  .success-box{ text-align:center; padding:40px 20px; }
  .success-icon{
    width:60px; height:60px; border-radius:50%; margin:0 auto 20px; font-size:1.6rem;
    background:linear-gradient(135deg,var(--blue),var(--cyan)); color:#04060a;
    display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .success-box h2{ color:#fff; }
  .success-box p{ margin-top:10px; color:var(--dim); font-size:0.9rem; line-height:1.5; }
</style>
</head>
<body>

<header>
  <h1>INNOVEX<span>A</span> SOLUTIONS — Payment</h1>
</header>

<main id="main">
  <div class="state" id="loadingState">Loading your booking details…</div>
</main>

<script>
  const API_BASE = window.location.origin;
  const params = new URLSearchParams(window.location.search);
  const bookingId = params.get('id');
  const token = params.get('token');
  const main = document.getElementById('main');

  const SERVICE_PRICES_NOTE = 'Final amount is set by Innovexa Solutions based on your project scope.';

  // --- Fill in your real account details here ---
  const PAYMENT_ACCOUNTS = {
    jazzcash: { title: 'JazzCash', name: 'Innovexa Solutions', number: '0349-2718571' },
    easypaisa: { title: 'EasyPaisa', name: 'Innovexa Solutions', number: '0349-2718571' },
    bank: { title: 'Bank Transfer', bank: 'Meezan Bank', name: 'Innovexa Solutions', iban: 'PK00MEZN0000000000000000' },
  };
  const PAYPAL_CLIENT_ID = ''; // paste your PayPal business Client ID here to enable the PayPal button

  async function loadBooking() {
    if (!bookingId || !token) {
      renderError('This payment link is missing information. Please use the exact link sent to you.');
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/api/bookings/${bookingId}/payment?token=${token}`);
      const data = await res.json();
      if (!res.ok) {
        renderError(data.error || 'Unable to load this booking.');
        return;
      }
      renderPaymentPage(data.booking);
    } catch (err) {
      renderError('Could not connect to the server. Please check your internet connection or try again shortly.');
    }
  }

  function renderError(message) {
    main.innerHTML = `<div class="state error">⚠ ${message}</div>`;
  }

  function renderPaymentPage(booking) {
    if (booking.payment_status === 'paid') {
      main.innerHTML = `
        <div class="success-box">
          <div class="success-icon">✓</div>
          <h2>Payment already confirmed</h2>
          <p>Thanks, ${booking.name}! Your payment for <strong>${booking.service}</strong> has been confirmed. We'll be in touch to get started.</p>
        </div>`;
      return;
    }

    if (booking.payment_status === 'submitted') {
      main.innerHTML = `
        <div class="success-box">
          <div class="success-icon">✓</div>
          <h2>Payment submitted</h2>
          <p>Thanks, ${booking.name}! We've received your payment details for <strong>${booking.service}</strong> and are confirming it. This usually takes a few hours.</p>
        </div>`;
      return;
    }

    const amountHtml = booking.amount
      ? `<div class="amount-due">Rs. ${Number(booking.amount).toLocaleString()}</div>`
      : `<div class="note" style="margin:0;">${SERVICE_PRICES_NOTE}</div>`;

    main.innerHTML = `
      <div class="summary">
        <h2>Booking Summary</h2>
        <div class="summary-row"><span>Service</span><span>${booking.service}</span></div>
        <div class="summary-row"><span>Date</span><span>${booking.date}</span></div>
        <div class="summary-row"><span>Time</span><span>${booking.time}</span></div>
        <div class="summary-row"><span>Client</span><span>${booking.name}</span></div>
        <div class="summary-row"><span>Amount due</span><span>${amountHtml}</span></div>
      </div>

      <label class="mono" style="margin-top:0;">Choose a payment method</label>
      <div class="method-tabs">
        <div class="method-tab active" data-method="jazzcash">JazzCash</div>
        <div class="method-tab" data-method="easypaisa">EasyPaisa</div>
        <div class="method-tab" data-method="bank">Bank</div>
        <div class="method-tab" data-method="paypal">PayPal</div>
      </div>

      <div class="method-panel active" data-panel="jazzcash">${manualPanel('jazzcash', booking)}</div>
      <div class="method-panel" data-panel="easypaisa">${manualPanel('easypaisa', booking)}</div>
      <div class="method-panel" data-panel="bank">${bankPanel(booking)}</div>
      <div class="method-panel" data-panel="paypal">${paypalPanel(booking)}</div>
    `;

    document.querySelectorAll('.method-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.method-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.method-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.querySelector(`.method-panel[data-panel="${tab.dataset.method}"]`).classList.add('active');
      });
    });

    document.querySelectorAll('form[data-payment-form]').forEach(form => {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const method = form.dataset.paymentForm;
        const reference = form.querySelector('input[name="reference"]').value.trim();
        const btn = form.querySelector('button');
        btn.disabled = true;
        btn.textContent = 'Submitting…';
        try {
          const res = await fetch(`${API_BASE}/api/bookings/${bookingId}/payment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, method, reference }),
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.error || 'Something went wrong.');
            btn.disabled = false;
            btn.textContent = "I've sent the payment";
            return;
          }
          renderPaymentPage(data.booking);
        } catch (err) {
          alert('Could not reach the server. Please try again.');
          btn.disabled = false;
          btn.textContent = "I've sent the payment";
        }
      });
    });

    if (PAYPAL_CLIENT_ID) {
      loadPaypalButton(booking);
    }
  }

  function manualPanel(method, booking) {
    const acc = PAYMENT_ACCOUNTS[method];
    return `
      <h3>Pay via ${acc.title}</h3>
      <div class="account-box">
        <div><span class="label">Account name</span><span class="value">${acc.name}</span></div>
        <div><span class="label">${acc.title} number</span><span class="value">${acc.number}</span></div>
      </div>
      <p class="note">Send the amount above to the ${acc.title} number, then enter your transaction ID or the sender's name below so we can match your payment.</p>
      <form data-payment-form="${method}">
        <label>Transaction ID / Sender name</label>
        <input type="text" name="reference" placeholder="e.g. TXN12345 or Ali Khan" required>
        <button type="submit" class="submit-btn">I've sent the payment</button>
      </form>
    `;
  }

  function bankPanel(booking) {
    const acc = PAYMENT_ACCOUNTS.bank;
    return `
      <h3>Bank Transfer</h3>
      <div class="account-box">
        <div><span class="label">Bank</span><span class="value">${acc.bank}</span></div>
        <div><span class="label">Account title</span><span class="value">${acc.name}</span></div>
        <div><span class="label">IBAN</span><span class="value">${acc.iban}</span></div>
      </div>
      <p class="note">Transfer the amount above via online banking or at a branch, then enter your transaction reference below.</p>
      <form data-payment-form="bank">
        <label>Bank transaction reference</label>
        <input type="text" name="reference" placeholder="Reference / transaction number" required>
        <button type="submit" class="submit-btn">I've sent the payment</button>
      </form>
    `;
  }

  function paypalPanel(booking) {
    if (!PAYPAL_CLIENT_ID) {
      return `
        <h3>Pay via PayPal</h3>
        <p class="note">PayPal isn't set up yet for this business. Please choose JazzCash, EasyPaisa, or Bank Transfer instead, or contact us on WhatsApp for a PayPal invoice.</p>
      `;
    }
    return `
      <h3>Pay via PayPal</h3>
      <p class="note">You'll be redirected to PayPal to complete your payment securely.</p>
      <div id="paypal-button-container"></div>
    `;
  }

  function loadPaypalButton(booking) {
    if (!booking.amount) return; // PayPal needs a fixed amount
    const script = document.createElement('script');
    script.src = `https://www.paypal.com/sdk/js?client-id=${PAYPAL_CLIENT_ID}&currency=USD`;
    script.onload = () => {
      paypal.Buttons({
        createOrder: (data, actions) => actions.order.create({
          purchase_units: [{ amount: { value: booking.amount } }],
        }),
        onApprove: async (data, actions) => {
          const order = await actions.order.capture();
          await fetch(`${API_BASE}/api/bookings/${bookingId}/payment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, method: 'paypal', reference: order.id }),
          });
          loadBooking();
        },
      }).render('#paypal-button-container');
    };
    document.body.appendChild(script);
  }

  loadBooking();
</script>
</body>
</html>
